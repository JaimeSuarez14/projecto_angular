<app-hero />

<!-- Especialidades (grid reactivo desde ProductoService) -->
<app-platos-destacados />

<!-- Experiencia / historia -->
<app-experiencia />

<!-- Banda final de reservas -->
<section class="relative overflow-hidden bg-marino-950 py-24 text-center text-white">
  <img
    [src]="urlBanda"
    alt=""
    aria-hidden="true"
    loading="lazy"
    decoding="async"
    class="absolute inset-0 h-full w-full object-cover opacity-25"
  />
  <div class="absolute inset-0 bg-marino-950/75"></div>

  <div class="relative mx-auto max-w-3xl px-6" appRevelar>
    <p class="text-xs font-extrabold uppercase tracking-[0.3em] text-oro-400">Hoy el mar nos espera</p>
    <h2 class="mt-4 font-display text-4xl font-semibold sm:text-5xl">
      Asegura tu mesa frente al mejor ceviche de la costa
    </h2>
    <p class="mx-auto mt-5 max-w-xl leading-relaxed text-slate-300">
      Reserva en segundos, escoge tu local y déjanos preparar la frescura del día
      para tu llegada.
    </p>
    <div class="mt-10 flex flex-wrap justify-center gap-4">
      <a
        routerLink="/reservas"
        class="inline-flex items-center justify-center gap-2 rounded-full bg-oro-500 px-8 py-3.5 text-sm font-extrabold uppercase tracking-[0.18em] text-marino-950 shadow-lg shadow-oro-500/30 transition-all duration-300 ease-in-out hover:-translate-y-0.5 hover:bg-oro-400 hover:shadow-xl hover:shadow-oro-500/40"
      >
        Reservar ahora
      </a>
      <a
        [attr.href]="'tel:' + telefonoLimpio"
        class="inline-flex items-center justify-center gap-2 rounded-full border border-white/40 px-8 py-3.5 text-sm font-extrabold uppercase tracking-[0.18em] text-white transition-all duration-300 ease-in-out hover:-translate-y-0.5 hover:border-white/80 hover:bg-white/10"
      >
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
        {{ datos.telefono }}
      </a>
    </div>
  </div>
</section>
